# Render blueprint — the backend runs as a Docker web service because it needs
# Chromium for the scraper. Free plan sleeps, which is exactly why scheduling is
# driven by an external cron hitting /cron/tick (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: price-tracker-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Supabase connection string
      - key: JWTKEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: STOREFRONT_BASE
        value: https://demo.inelabteamdev.com
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: HEADLESS
        value: "true"
      - key: SELF_TICK
        value: "false"       # external cron drives ticks in production
      - key: MAX_TRACK_THREADS
        value: "3"
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
