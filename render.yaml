# Render blueprint. The backend runs as a Docker web service because it needs
# Chromium for scraping. The free plan sleeps when idle, so scheduling is driven
# by an external cron (cron-job.org) hitting POST /cron/tick every 10 minutes.
#
# Scheduled work is durable (a `tasks` table): a tick enqueues what is due and
# drains it inline for up to CRON_INLINE_BUDGET_SECONDS, so the instance stays
# awake while it works and anything unfinished resumes on the next tick. If you
# would rather not use an external scheduler, you can instead run
# `python manage.py run_jobs` from a paid Render Cron Job (see docs/DEPLOYMENT.md).

services:
  - type: web
    name: price-tracker-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase TRANSACTION pooler (:6543) for the app
      - key: DIRECT_DATABASE_URL
        sync: false          # optional: direct/session pooler (:5432), used only for migrations
      - key: JWTKEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: STOREFRONT_BASE
        value: https://demo.inelabteamdev.com
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: HEADLESS
        value: "true"
      - key: SELF_TICK
        value: "false"       # cron-job.org drives ticks
      - key: MANUAL_TRACK_THREADS
        value: "1"           # user "Refresh" lane — keep it fast and small
      - key: SCHEDULED_TRACK_THREADS
        value: "1"           # scheduled lane; bounded so memory stays flat
      - key: CRON_INLINE_BUDGET_SECONDS
        value: "25"          # only used when /cron/tick is called with ?drain=true
      - key: SCRAPE_REVEAL_TIMEOUT_MS
        value: "300000"      # price-reveal wait; storefront can be slow
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      # Render's free plan blocks outbound SMTP (ports 25/465/587), so email
      # goes over an HTTPS API. Set EMAIL_API_KEY (Brevo) in the dashboard.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_API_KEY
        sync: false          # Brevo API key
      - key: SMTP_FROM
        sync: false          # verified sender address
      - key: SMTP_FROM_NAME
        value: Price Tracker
      # SMTP stays available for local development only.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
