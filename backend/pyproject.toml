[project]
name = "price-tracker-backend"
version = "0.1.0"
description = "Price Tracker backend — Django scraper, scheduler and API for INE's mock storefront"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
    "playwright>=1.63",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "**/migrations/**"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
