# Price Tracker backend config. Mirrors the Go layout:
# [Core] server + tuning, [DB] database, [Email] notifier, [Security] secrets.
# Every value can be overridden by an environment variable (see boot/boot.py)
# so that Render/Supabase secrets never need to live in this file.

[Core]
port = "8080"
storefrontBase = "https://demo.inelabteamdev.com"
catalogTotal = 1000
catalogPageSize = 60
catalogMinIntervalMs = 600
catalogBudgetSeconds = 240
# Job runner lanes. Manual jobs (a user pressing "Refresh") get their own
# high-priority lane so they never queue behind scheduled scrapes. Scheduled
# jobs drain from the durable `tasks` table one (or a few) at a time to bound
# Chromium memory.
manualTrackThreads = 1
scheduledTrackThreads = 1
scrapeMaxAttempts = 3
scrapeTimeoutMs = 45000
scrapeMinMoves = 8
scrapeMinDwellMs = 700
headless = true
selfTick = true
tickSeconds = 60
minRefreshMinutes = 10
defaultRefreshMinutes = 120
# Only these cadences are offered, so every coarser cadence is a multiple of the
# finer ones and history can be re-bucketed without losing points.
allowedRefreshMinutes = [10, 30, 60, 120]
# Durable job queue / worker tuning.
scheduledPollSeconds = 15
scheduledLeaseSeconds = 600
jobMaxAttempts = 2
jobRetryBackoffSeconds = 30
maxTaskAgeSeconds = 7200
historyMaxPoints = 20000
cronBatchLimit = 50
cronBudgetSeconds = 240
# Inline drain budget for POST /cron/tick. cron-job.org's free plan times a
# request out after 30s, so keep this comfortably below that. Unfinished work
# stays in the durable queue for the next tick.
cronInlineBudgetSeconds = 25

[DB]
host = "127.0.0.1"
port = 5432
user = "pricedb"
password = "pricedb"
dbname = "pricedb"
# Full DSN wins over the fields above. Supabase: postgresql://postgres:...@db.xxx.supabase.co:5432/postgres
url = ""

[Email]
# provider: "smtp" (local/dev), or an HTTP API that works through Render's
# SMTP port block: "brevo", "sendgrid" or "resend".
provider = "smtp"
host = "smtp.gmail.com"
port = 587
user = ""
appPassword = ""
apiKey = ""
fromAddr = ""
fromName = "Price Tracker"

[Security]
jwtKey = ""
jwtTtlHours = 168
cronSecret = ""

[CORS]
allowOrigins = ["http://localhost:5173"]
