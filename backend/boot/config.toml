# Price Tracker backend config. Mirrors the Go layout:
# [Core] server + tuning, [DB] database, [Email] notifier, [Security] secrets.
# Every value can be overridden by an environment variable (see boot/boot.py)
# so that Render/Supabase secrets never need to live in this file.

[Core]
port = "8080"
storefrontBase = "https://demo.inelabteamdev.com"
catalogTotal = 1000
catalogPageSize = 60
catalogMinIntervalMs = 600
catalogBudgetSeconds = 240
# Job runner lanes. Manual jobs (a user pressing "Refresh") get their own
# high-priority lane so they never queue behind scheduled scrapes. Scheduled
# jobs drain from the durable `tasks` table one (or a few) at a time to bound
# Chromium memory.
manualTrackThreads = 1
scheduledTrackThreads = 1
scrapeMaxAttempts = 3
scrapeTimeoutMs = 45000
# The price block can take a while to reach its terminal state after the reveal
# click; give that wait its own (long) budget without stretching navigation.
scrapeRevealTimeoutMs = 300000
scrapeMinMoves = 8
scrapeMinDwellMs = 700
# How long to wait for the (usually absent) cookie banner per check. It used to
# be 2500ms and, called ~3x per scrape, dominated the run; the banner renders
# almost immediately when present.
cookieBannerTimeoutMs = 1000
# Reuse one Playwright + Chromium per worker thread instead of launching a
# browser for every product. Recycle after N scrapes to bound memory, and cache
# the layout classes for a short while.
scrapeBrowserReuse = true
scrapeBrowserRecycle = 25
scrapeLayoutTtlSeconds = 300
# Hard cap per product (attempts included). When exceeded we stop and move on;
# the durable task is retried on a later tick, so one flaky product can't stall
# the whole batch. 0 disables it.
scrapeProductBudgetMs = 120000
# How many products to scrape concurrently inside one browser (own context each).
scrapePageConcurrency = 2
headless = true
selfTick = true
tickSeconds = 60
minRefreshMinutes = 10
defaultRefreshMinutes = 120
# Only these cadences are offered, so every coarser cadence is a multiple of the
# finer ones and history can be re-bucketed without losing points.
allowedRefreshMinutes = [10, 30, 60, 120]
# Durable job queue / worker tuning.
scheduledPollSeconds = 15
scheduledLeaseSeconds = 600
jobMaxAttempts = 2
jobRetryBackoffSeconds = 30
maxTaskAgeSeconds = 7200
historyMaxPoints = 20000
cronBatchLimit = 50
cronBudgetSeconds = 240
# Inline drain budget for POST /cron/tick?drain=true. The default tick is
# fire-and-forget, so this only matters for synchronous drains. Keep it under
# cron-job.org's 30s request timeout; unfinished work stays in the queue.
cronInlineBudgetSeconds = 25

[DB]
host = "127.0.0.1"
port = 5432
user = "pricedb"
password = "pricedb"
dbname = "pricedb"
# Full DSN wins over the fields above. Supabase: postgresql://postgres:...@db.xxx.supabase.co:5432/postgres
url = ""

[Email]
# provider: "smtp" (local/dev), or an HTTP API that works through Render's
# SMTP port block: "brevo", "sendgrid" or "resend".
provider = "smtp"
host = "smtp.gmail.com"
port = 587
user = ""
appPassword = ""
apiKey = ""
fromAddr = ""
fromName = "Price Tracker"
# Protect the daily send quota: only email on the out-of-stock -> in-stock
# transition. Price-drop alerts are still shown in-app but not emailed.
backInStockOnly = true

[Security]
jwtKey = ""
jwtTtlHours = 168
cronSecret = ""

[CORS]
allowOrigins = ["http://localhost:5173"]
